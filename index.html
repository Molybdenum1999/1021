<title>Castle Adventure</title>
<style>
  html, body { margin: 0; height: 100%; background: #E3DBD3; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #scene { height: 100vh; height: 100dvh; width: auto; max-width: 100vw; display: block; touch-action: none; user-select: none; }

  /* Gear starts hidden and fades when toggled */
  #shield, #tie, #helmet { transition: opacity .3s ease; }
  .off { opacity: 0; }

  /* Buttons */
  #shield-button, #tie-button, #helmet-button { cursor: pointer; transition: opacity .8s ease; }
  #shield-button:hover, #tie-button:hover, #helmet-button:hover { filter: url(#btn-glow); }
  .faded { opacity: 0; pointer-events: none; }

  /* Door */
  #door { transition: transform 1.6s cubic-bezier(.5,0,.2,1); }
  #door-glow { opacity: 0; transition: opacity .6s ease; }
  .door-ready #door { cursor: pointer; filter: url(#door-inner); }
  .door-ready #door-glow { animation: pulse 1.4s ease-in-out infinite; }
  .door-open #door { transform: translateY(-173.7px); } /* 90% of the door's 193px height */

  /* Hall pulse */
  .hall-glow #hall { filter: url(#hall-glow); }

  /* Hero */
  #hero-drag { transform-box: fill-box; transform-origin: center; }
  .hero-active #hero { animation: bob 1.6s ease-in-out infinite; }
  .hero-active #hero-drag { cursor: grab; }
  .dragging #hero-drag { cursor: grabbing; }
  .hero-exit #hero-drag { transition: transform 1.2s ease, opacity 1.2s ease; opacity: 0; pointer-events: none; }

  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) {
    .hero-active #hero, .door-ready #door-glow { animation: none; }
    .door-ready #door-glow { opacity: 1; }
  }
</style>

<script>
(() => {
  const svg = document.getElementById('scene');
  const $ = id => document.getElementById(id);
  const hero = $('hero-drag'), hall = $('hall'), door = $('door');
  const pairs = { 'shield-button': 'shield', 'tie-button': 'tie', 'helmet-button': 'helmet' };
  const clicked = new Set();

  Object.entries(pairs).forEach(([btn, item]) => {
    $(btn).addEventListener('click', () => {
      $(item).classList.toggle('off');
      clicked.add(btn);
      if (clicked.size === 3 && !svg.classList.contains('door-open')) svg.classList.add('door-ready');
    });
  });

  door.addEventListener('click', () => {
    if (!svg.classList.contains('door-ready')) return;
    svg.classList.remove('door-ready');
    svg.classList.add('door-open', 'hall-glow', 'hero-active');
    Object.keys(pairs).forEach(id => $(id).classList.add('faded'));
  });

  // Vertical drag, in SVG user units
  const toSvgY = e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse()).y;
  };
  const base = hero.getBBox();           // untransformed hero bounds
  const hb = hall.getBBox();
  let dy = 0, startY = 0, startDy = 0, dragging = false, done = false;

  hero.addEventListener('pointerdown', e => {
    if (!svg.classList.contains('hero-active') || done) return;
    dragging = true; startY = toSvgY(e); startDy = dy;
    hero.setPointerCapture(e.pointerId);
    svg.classList.add('dragging');
    e.preventDefault();
  });
  hero.addEventListener('pointermove', e => {
    if (!dragging) return;
    // keep the hero within the scene vertically
    dy = Math.min(812 - (base.y + base.height), Math.max(-base.y, startDy + toSvgY(e) - startY));
    hero.style.transform = `translate(0px, ${dy}px)`;
    // "over the hall": hero's head (top quarter) has entered the hall opening
    const headY = base.y + dy + base.height * 0.25;
    if (headY < hb.y + hb.height && headY > hb.y) finish();
  });
  const end = () => { dragging = false; svg.classList.remove('dragging'); };
  hero.addEventListener('pointerup', end);
  hero.addEventListener('pointercancel', end);

  function finish() {
    done = true; end();
    svg.classList.remove('hall-glow', 'hero-active');
    const db = door.getBBox();
    // Center on the door's opening (its resting place, which the hall fills)
    const tx = (db.x + db.width / 2) - (base.x + base.width / 2);
    const ty = (hb.y + hb.height / 2) - (base.y + base.height / 2);
    hero.getBoundingClientRect(); // commit current transform before transitioning
    svg.classList.add('hero-exit');
    hero.style.transform = `translate(${tx}px, ${ty}px) scale(0.5)`;
  }
})();
</script>
